services:
  app:
    build: .
    ports:
      - "8787:8787"
    environment:
      # Secrets come only from env vars (config.toml references them by name)
      CV_KEY_ADMIN: ${CV_KEY_ADMIN:?set CV_KEY_ADMIN in .env}
      CV_KEY_VIEWER: ${CV_KEY_VIEWER:?set CV_KEY_VIEWER in .env}
      # Only needed when tagging.provider = "api":
      # CV_TAGGING_API_KEY: ${CV_TAGGING_API_KEY:-}
    volumes:
      - cv-data:/data/contextvault
      - ./config.toml:/app/config.toml:ro
    restart: unless-stopped

volumes:
  cv-data: